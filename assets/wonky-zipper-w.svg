<svg xmlns="http://www.w3.org/2000/svg" viewBox="78 132 265 178" role="img" aria-labelledby="title description">
  <title id="title">Wonky Zipper curled-paper W</title>
  <desc id="description">Three white paper curls casting a W-shaped shadow over a transparent background.</desc>
  <defs>
    <linearGradient id="shadow-left" x1="0" y1="1" x2="0.22" y2="0">
      <stop offset="0" stop-color="#504d4d" stop-opacity="0.58"/>
      <stop offset="0.34" stop-color="#777171" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9b9294" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow-middle" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#504d4d" stop-opacity="0.54"/>
      <stop offset="0.38" stop-color="#777171" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#9b9294" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shadow-right" x1="1" y1="1" x2="0.78" y2="0">
      <stop offset="0" stop-color="#504d4d" stop-opacity="0.58"/>
      <stop offset="0.34" stop-color="#777171" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#9b9294" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="curl-edge-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <linearGradient id="curl-edge-right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0.72" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8f8f8"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="contact-shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- Soft upward-cast cavities. The transparent field lets the page plaid show through. -->
  <g filter="url(#soft-shadow)">
    <path d="M93 169 C127 176 151 205 174 286 L195 238 C171 176 137 145 98 143 Z" fill="url(#shadow-left)"/>
    <path d="M174 286 L210 230 L246 286 C245 221 232 166 210 139 C188 166 175 221 174 286 Z" fill="url(#shadow-middle)"/>
    <path d="M246 286 C269 205 293 176 327 169 L322 143 C283 145 249 176 225 238 Z" fill="url(#shadow-right)"/>
  </g>

  <!-- Crisp contact shadows immediately beneath the lifted curl edges. -->
  <g fill="#555153" opacity="0.42" filter="url(#contact-shadow)">
    <path d="M96 165 C130 170 154 206 176 284 L169 287 C146 210 124 178 93 173 Z"/>
    <path d="M177 284 L210 229 L243 284 L247 287 L210 239 L173 287 Z"/>
    <path d="M244 284 C266 206 290 170 324 165 L327 173 C296 178 274 210 251 287 Z"/>
  </g>

  <!-- Main sheet: exact white, with its straight top edge interrupted only by the three curls. -->
  <path d="M0 166 H94 C124 166 145 196 176 286 L210 231 L244 286 C275 196 296 166 326 166 H420 V420 H0 Z" fill="#ffffff"/>

  <!-- Three lifted white curl surfaces. -->
  <path d="M94 166 C125 166 145 194 176 286 C165 234 148 190 112 169 C106 166 100 165 94 166 Z" fill="url(#curl-edge-left)"/>
  <path d="M176 286 L210 231 L244 286 C236 258 225 239 210 224 C195 239 184 258 176 286 Z" fill="#ffffff"/>
  <path d="M244 286 C275 194 295 166 326 166 C320 165 314 166 308 169 C272 190 255 234 244 286 Z" fill="url(#curl-edge-right)"/>

  <!-- Hairline paper edges retain definition without turning the curls gray. -->
  <g fill="none" stroke="#ddd9da" stroke-width="0.8" stroke-linecap="round" opacity="0.75">
    <path d="M94 166 C125 166 145 194 176 286"/>
    <path d="M176 286 L210 231 L244 286"/>
    <path d="M244 286 C275 194 295 166 326 166"/>
  </g>
</svg>
