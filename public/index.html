<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Wonky Zipper">
    <meta name="theme-color" content="#ffffff">
    <title>Wonky Zipper</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="wz-hero" aria-label="Wonky Zipper">
      <section class="wz-hero__left" aria-hidden="true"></section>
      <section class="wz-hero__letter-strip" aria-hidden="true">
        <span class="wz-letter wz-letter--w">W</span>
        <span class="wz-letter wz-letter--z">Z</span>
      </section>
      <section class="wz-hero__right" aria-hidden="true"></section>
    </main>
  </body>
</html>
